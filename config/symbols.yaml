# config/symbols.yaml
# Symbol-specific settings.
# Each symbol has its own pip value, spread limit, and session preference.

XAUUSD:
  pip_size: 0.10              # 1 pip = $0.10 movement
  pip_value_per_lot: 1.0      # $1 per pip per 0.01 lot (100 oz contract)
  contract_size: 100          # 100 oz per standard lot
  min_lot: 0.01
  max_lot: 5.0
  lot_step: 0.01
  max_spread_pips: 1.5        # London session ECN
  preferred_sessions:
    - LONDON
    - NEW_YORK
    - OVERLAP
  skip_sessions:
    - ASIA
    - OFF
  broker_symbol: "XAUUSD"     # Symbol name on your MT5 broker (may differ)

# Add EURUSD, GBPUSD etc here only after XAUUSD is proven
