version: '2026-05-11'
philosophy:
- Detect market regime first
- Select best strategy for that regime
- Generate signal only if regime and strategy align
- Score with multiple confirmations
- Check risk limits before execution
- Execute MT5 demo until verified
- Log everything for analysis
